name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and debug APK
        run: ./gradlew testDebugUnitTest assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk student-fit.apk
      - uses: actions/upload-artifact@v4
        with:
          name: student-fit-debug-apk
          path: student-fit.apk

      # main에 올라갈 때마다 "latest" 릴리스의 APK를 새것으로 바꿔요.
      # 폰에서 https://github.com/<owner>/<repo>/releases/latest/download/student-fit.apk 로 바로 받을 수 있어요.
      - name: Publish latest APK
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="빌드 #${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7}). 폰에서 student-fit.apk를 눌러 설치하세요."
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest student-fit.apk --clobber
            gh release edit latest --notes "$NOTES"
          else
            gh release create latest student-fit.apk --title "스튜던트 핏 최신 버전" --notes "$NOTES" --latest
          fi
          git tag -f latest "$GITHUB_SHA"
          git push -f origin refs/tags/latest
